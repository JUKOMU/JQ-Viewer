name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.0.4)'
        required: false
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check version consistency
        run: npm run check:version

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

  frontend:
    needs: validate-release-input
    uses: ./.github/workflows/ci-frontend.yml

  android-jvm:
    needs: validate-release-input
    uses: ./.github/workflows/ci-android-jvm.yml

  instrumentation:
    needs: validate-release-input
    uses: ./.github/workflows/ci-android-instrumentation.yml

  build-release:
    needs: [validate-release-input, frontend, android-jvm, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.release_commit.outputs.sha }}
      is_prerelease: ${{ steps.release_mode.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit
        id: release_commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag $RELEASE_TAG is not available in the checked-out repository"
            exit 1
          fi

          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$checked_out_commit" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $tag_commit, but checkout is $checked_out_commit"
            exit 1
          fi
          echo "sha=$checked_out_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: release_mode
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* || "$REQUESTED_PRERELEASE" == "true" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - run: npx cap sync android

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "::error::Missing required release signing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=app/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease -PenableAbiSplits=true

      - name: Rename release APKs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_name="$RELEASE_TAG"
          version="${tag_name#v}"
          version="${version//./_}"
          output_dir="android/app/build/outputs/apk/release"
          cp "$output_dir/app-universal-release.apk" "JQ-Viewer-${version}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "$output_dir/app-$abi-release.apk" "JQ-Viewer-${version}-$abi.apk"
          done

      - name: Validate release APKs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_RELEASE_CERT_SHA256: '6667B73DA7322E56626D82CA0EFCF03386E0B5560E14DF48C6025142FF4197EA'
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          artifact_version="${version//./_}"
          apk_prefix="JQ-Viewer-${artifact_version}"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi

          apkanalyzer_path="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer_path" ]; then
            apkanalyzer_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort | tail -n 1)"
          fi
          apksigner_path="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          if [ ! -x "$apkanalyzer_path" ] || [ ! -x "$apksigner_path" ]; then
            echo "::error::Required Android APK inspection tools were not found"
            exit 1
          fi

          expected_application_id="$(awk '$1 == "applicationId" { gsub(/"/, "", $2); print $2; exit }' android/app/build.gradle)"
          expected_version_code="$(awk '$1 == "versionCode" { print $2; exit }' android/app/build.gradle)"
          expected_version_name="$(awk '$1 == "versionName" { gsub(/"/, "", $2); print $2; exit }' android/app/build.gradle)"
          expected_min_sdk="$(awk -F= '$1 ~ /minSdkVersion/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' android/variables.gradle)"
          expected_target_sdk="$(awk -F= '$1 ~ /targetSdkVersion/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' android/variables.gradle)"

          if [ -z "$expected_application_id" ] || [ -z "$expected_version_code" ] || \
             [ -z "$expected_version_name" ] || [ -z "$expected_min_sdk" ] || \
             [ -z "$expected_target_sdk" ]; then
            echo "::error::Expected Android release metadata could not be read from source"
            exit 1
          fi

          assert_equal() {
            label="$1"
            expected="$2"
            actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label mismatch: expected $expected, got $actual"
              exit 1
            fi
            echo "$label verified: $actual"
          }

          validate_apk() {
            apk_path="$1"
            expected_abi="$2"
            if [ ! -s "$apk_path" ]; then
              echo "::error::Release APK is missing or empty: $apk_path"
              exit 1
            fi

            actual_application_id="$("$apkanalyzer_path" manifest application-id "$apk_path")"
            actual_version_code="$("$apkanalyzer_path" manifest version-code "$apk_path")"
            actual_version_name="$("$apkanalyzer_path" manifest version-name "$apk_path")"
            actual_min_sdk="$("$apkanalyzer_path" manifest min-sdk "$apk_path")"
            actual_target_sdk="$("$apkanalyzer_path" manifest target-sdk "$apk_path")"
            assert_equal "Application ID ($expected_abi)" "$expected_application_id" "$actual_application_id"
            assert_equal "Version code ($expected_abi)" "$expected_version_code" "$actual_version_code"
            assert_equal "Version name ($expected_abi)" "$expected_version_name" "$actual_version_name"
            assert_equal "Minimum SDK ($expected_abi)" "$expected_min_sdk" "$actual_min_sdk"
            assert_equal "Target SDK ($expected_abi)" "$expected_target_sdk" "$actual_target_sdk"

            mapfile -t packaged_abis < <(
              unzip -Z1 "$apk_path" | awk -F/ '$1 == "lib" { print $2 }' | sort -u
            )
            if [ "$expected_abi" = "universal" ]; then
              expected_abis=(arm64-v8a armeabi-v7a x86 x86_64)
            else
              expected_abis=("$expected_abi")
            fi
            if [ "${packaged_abis[*]}" != "${expected_abis[*]}" ]; then
              echo "::error::APK ABI mismatch for $apk_path: expected ${expected_abis[*]}, got ${packaged_abis[*]}"
              exit 1
            fi

            certificate_output="$("$apksigner_path" verify \
              --min-sdk-version "$actual_min_sdk" --print-certs "$apk_path")"
            mapfile -t certificate_digests < <(
              printf '%s\n' "$certificate_output" \
                | sed -n 's/^.*certificate SHA-256 digest: //p' \
                | tr '[:lower:]' '[:upper:]' | sort -u
            )
            if [ "${#certificate_digests[@]}" -ne 1 ] || \
               [ "${certificate_digests[0]}" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
              echo "::error::Release APK signing certificate mismatch for $apk_path"
              exit 1
            fi
          }

          validate_apk "$apk_prefix-universal.apk" universal
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            validate_apk "$apk_prefix-$abi.apk" "$abi"
          done

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          for apk_path in JQ-Viewer-*.apk; do
            sha256sum "$apk_path" > "$apk_path.sha256"
          done

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            JQ-Viewer-*.apk
            JQ-Viewer-*.apk.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

      - name: Attach APK to draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          draft: true
          prerelease: ${{ steps.release_mode.outputs.is_prerelease == 'true' }}
          body_path: .github/release-notes.md
          generate_release_notes: false
          overwrite_files: true
          files: JQ-Viewer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Cleanup signing secrets and build artifacts
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f android/app/release.keystore
          rm -f android/keystore.properties
          rm -f android/app/build/outputs/apk/release/app-*-release.apk
          rm -f JQ-Viewer-*.apk
          rm -f JQ-Viewer-*.apk.sha256

  publish-release:
    needs: build-release
    runs-on: [self-hosted, Linux, X64, jqviewer-release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.build-release.outputs.release_commit }}
        run: |
          set -euo pipefail

          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag $RELEASE_TAG is not available in the checked-out repository"
            exit 1
          fi

          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$EXPECTED_RELEASE_COMMIT" ] || \
             [ "$checked_out_commit" != "$EXPECTED_RELEASE_COMMIT" ]; then
            echo "::error::Release commit changed between build and publish"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ${{ runner.temp }}/release-artifact

      - name: Verify release APK artifacts
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifact"
          mapfile -t apk_files < <(find "$artifact_dir" -maxdepth 1 -type f -name 'JQ-Viewer-*.apk' | sort)
          if [ "${#apk_files[@]}" -ne 5 ]; then
            echo "::error::Expected five release APK artifacts, got ${#apk_files[@]}"
            exit 1
          fi
          for apk_path in "${apk_files[@]}"; do
            if [ ! -s "$apk_path.sha256" ]; then
              echo "::error::Missing APK checksum: $apk_path.sha256"
              exit 1
            fi
          done
          (cd "$artifact_dir" && sha256sum --check JQ-Viewer-*.apk.sha256)

      - name: Wait for mirrored Gitee tag
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build-release.outputs.release_commit }}
        run: |
          set -euo pipefail

          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Missing required release secret: GITEE_TOKEN"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            tags_json="$(curl --fail --silent --show-error --retry 2 --get \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=1" \
              "https://gitee.com/api/v5/repos/jukomu/jq-viewer/tags")"
            gitee_commit="$(printf '%s' "$tags_json" \
              | jq -r --arg tag "$RELEASE_TAG" \
                '.[] | select(.name == $tag) | .commit.sha' \
              | head -n 1)"

            if [ -n "$gitee_commit" ] && [ "$gitee_commit" = "$RELEASE_COMMIT" ]; then
              echo "Gitee tag verified: $RELEASE_TAG -> $gitee_commit"
              exit 0
            fi

            echo "Waiting for Gitee mirror: tag=$RELEASE_TAG attempt=$attempt/30"
            sleep 10
          done

          echo "::error::Gitee tag was not mirrored to the expected commit"
          exit 1

      - name: Prepare release metadata
        if: ${{ needs.build-release.outputs.is_prerelease != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_RELEASE_CERT_SHA256: '6667B73DA7322E56626D82CA0EFCF03386E0B5560E14DF48C6025142FF4197EA'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITEE_REPOSITORY: jukomu/jq-viewer
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifact"
          node scripts/release-assets.mjs \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/latest.json" \
            "$artifact_dir"/JQ-Viewer-*.apk

      - name: Publish APK and latest.json to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: jukomu/jq-viewer
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PRERELEASE: ${{ needs.build-release.outputs.is_prerelease }}
          RELEASE_COMMIT: ${{ needs.build-release.outputs.release_commit }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifact"
          latest_json="-"
          if [ "$RELEASE_PRERELEASE" != "true" ]; then
            latest_json="$RUNNER_TEMP/latest.json"
          fi
          args=(
            "$RELEASE_TAG"
            ".github/release-notes.md"
            "$RELEASE_COMMIT"
            "$latest_json"
            "$artifact_dir"/JQ-Viewer-*.apk
          )
          node scripts/publish-gitee-release.mjs "${args[@]}"

      - name: Publish stable GitHub Release
        if: ${{ needs.build-release.outputs.is_prerelease != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.build-release.outputs.release_commit }}
          draft: false
          prerelease: false
          body_path: .github/release-notes.md
          generate_release_notes: false
          overwrite_files: true
          files: ${{ runner.temp }}/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Publish prerelease GitHub Release
        if: ${{ needs.build-release.outputs.is_prerelease == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.build-release.outputs.release_commit }}
          draft: false
          prerelease: true
          body_path: .github/release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify public release assets
        if: ${{ needs.build-release.outputs.is_prerelease != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          github_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          gitee_base="https://gitee.com/jukomu/jq-viewer/releases/download/$RELEASE_TAG"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          github_manifest="$temp_dir/github-latest.json"
          gitee_manifest="$temp_dir/gitee-latest.json"

          curl --fail --silent --show-error --location --retry 3 \
            "$github_base/latest.json" -o "$github_manifest"
          curl --fail --silent --show-error --location --retry 3 \
            "$gitee_base/latest.json" -o "$gitee_manifest"

          if ! cmp --silent "$github_manifest" "$gitee_manifest"; then
            echo "::error::GitHub/Gitee latest.json bytes are different"
            exit 1
          fi

          if [ "$(jq -r '.tag' "$github_manifest")" != "$RELEASE_TAG" ] || \
             [ "$(jq -r '.schemaVersion' "$github_manifest")" != "1" ] || \
             [ "$(jq '.variants | length' "$github_manifest")" != "4" ]; then
            echo "::error::latest.json release identity or variant count is invalid"
            exit 1
          fi

          mapfile -t manifest_abis < <(jq -r '.variants[].abi' "$github_manifest" | sort)
          expected_abis=(arm64-v8a armeabi-v7a x86 x86_64)
          if [ "${manifest_abis[*]}" != "${expected_abis[*]}" ]; then
            echo "::error::latest.json ABI variants are incomplete"
            exit 1
          fi

          jq -c '[{abi: "universal", apkName, sizeBytes, sha256, sources}] + .variants | .[]' \
            "$github_manifest" | while IFS= read -r artifact; do
            abi="$(jq -r '.abi' <<<"$artifact")"
            apk_name="$(jq -r '.apkName' <<<"$artifact")"
            expected_size="$(jq -r '.sizeBytes' <<<"$artifact")"
            expected_sha="$(jq -r '.sha256' <<<"$artifact" | tr '[:lower:]' '[:upper:]')"
            expected_github_url="$(jq -r '.sources.github' <<<"$artifact")"
            expected_gitee_url="$(jq -r '.sources.gitee' <<<"$artifact")"
            github_apk="$temp_dir/github-$abi.apk"
            gitee_apk="$temp_dir/gitee-$abi.apk"

            curl --fail --silent --show-error --location --retry 3 \
              "$github_base/$apk_name" -o "$github_apk"
            curl --fail --silent --show-error --location --retry 3 \
              "$gitee_base/$apk_name" -o "$gitee_apk"
            if ! cmp --silent "$github_apk" "$gitee_apk"; then
              echo "::error::GitHub/Gitee APK bytes differ for $abi"
              exit 1
            fi
            actual_size="$(stat -c '%s' "$github_apk")"
            actual_sha="$(sha256sum "$github_apk" | awk '{print toupper($1)}')"
            if [ "$actual_size" != "$expected_size" ] || [ "$actual_sha" != "$expected_sha" ] || \
               [ "$expected_github_url" != "$github_base/$apk_name" ] || \
               [ "$expected_gitee_url" != "$gitee_base/$apk_name" ]; then
              echo "::error::latest.json does not match public APK for $abi"
              exit 1
            fi
          done

          echo "Public release assets verified: five identical APKs and latest.json"

      - name: Cleanup downloaded release artifacts
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-artifact"
          rm -f "$RUNNER_TEMP/latest.json"
