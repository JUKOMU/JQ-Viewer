name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.0.4)'
        required: false
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version consistency
        run: npm run check:version

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

  frontend:
    needs: validate-release-input
    uses: ./.github/workflows/ci-frontend.yml

  android-jvm:
    needs: validate-release-input
    uses: ./.github/workflows/ci-android-jvm.yml

  instrumentation:
    needs: validate-release-input
    uses: ./.github/workflows/ci-android-instrumentation.yml

  release:
    needs: [validate-release-input, frontend, android-jvm, instrumentation]
    runs-on: [self-hosted, Linux, X64, jqviewer-release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit
        id: release_commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag $RELEASE_TAG is not available in the checked-out repository"
            exit 1
          fi

          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$checked_out_commit" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $tag_commit, but checkout is $checked_out_commit"
            exit 1
          fi
          echo "sha=$checked_out_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: release_mode
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* || "$REQUESTED_PRERELEASE" == "true" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Wait for mirrored Gitee tag
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Missing required release secret: GITEE_TOKEN"
            exit 1
          fi

          expected_commit="$RELEASE_COMMIT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            expected_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi

          for attempt in $(seq 1 30); do
            tags_json="$(curl --fail --silent --show-error --retry 2 --get \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=1" \
              "https://gitee.com/api/v5/repos/jukomu/jq-viewer/tags")"
            gitee_commit="$(printf '%s' "$tags_json" \
              | jq -r --arg tag "$RELEASE_TAG" \
                '.[] | select(.name == $tag) | .commit.sha' \
              | head -n 1)"

            if [ -n "$gitee_commit" ] && [ "$gitee_commit" = "$expected_commit" ]; then
              echo "Gitee tag verified: $RELEASE_TAG -> $gitee_commit"
              exit 0
            fi

            echo "Waiting for Gitee mirror: tag=$RELEASE_TAG attempt=$attempt/30"
            sleep 10
          done

          echo "::error::Gitee tag was not mirrored to the expected commit"
          exit 1

      - name: Build frontend
        run: npm run build

      - run: npx cap sync android

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GITEE_TOKEN; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "::error::Missing required release signing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=app/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease

      - name: Rename release APK
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_name="$RELEASE_TAG"
          version="${tag_name#v}"
          version="${version//./_}"
          cp android/app/build/outputs/apk/release/app-release.apk "JQ-Viewer-${version}.apk"

      - name: Validate release APK
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_RELEASE_CERT_SHA256: '6667B73DA7322E56626D82CA0EFCF03386E0B5560E14DF48C6025142FF4197EA'
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          artifact_version="${version//./_}"
          apk_path="JQ-Viewer-${artifact_version}.apk"

          if [ ! -s "$apk_path" ]; then
            echo "::error::Release APK is missing or empty: $apk_path"
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi

          apkanalyzer_path="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer_path" ]; then
            apkanalyzer_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort | tail -n 1)"
          fi
          apksigner_path="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          if [ ! -x "$apkanalyzer_path" ] || [ ! -x "$apksigner_path" ]; then
            echo "::error::Required Android APK inspection tools were not found"
            exit 1
          fi

          expected_application_id="$(awk '$1 == "applicationId" { gsub(/"/, "", $2); print $2; exit }' android/app/build.gradle)"
          expected_version_code="$(awk '$1 == "versionCode" { print $2; exit }' android/app/build.gradle)"
          expected_version_name="$(awk '$1 == "versionName" { gsub(/"/, "", $2); print $2; exit }' android/app/build.gradle)"
          expected_min_sdk="$(awk -F= '$1 ~ /minSdkVersion/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' android/variables.gradle)"
          expected_target_sdk="$(awk -F= '$1 ~ /targetSdkVersion/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' android/variables.gradle)"

          if [ -z "$expected_application_id" ] || [ -z "$expected_version_code" ] || \
             [ -z "$expected_version_name" ] || [ -z "$expected_min_sdk" ] || \
             [ -z "$expected_target_sdk" ]; then
            echo "::error::Expected Android release metadata could not be read from source"
            exit 1
          fi

          actual_application_id="$("$apkanalyzer_path" manifest application-id "$apk_path")"
          actual_version_code="$("$apkanalyzer_path" manifest version-code "$apk_path")"
          actual_version_name="$("$apkanalyzer_path" manifest version-name "$apk_path")"
          actual_min_sdk="$("$apkanalyzer_path" manifest min-sdk "$apk_path")"
          actual_target_sdk="$("$apkanalyzer_path" manifest target-sdk "$apk_path")"

          assert_equal() {
            label="$1"
            expected="$2"
            actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label mismatch: expected $expected, got $actual"
              exit 1
            fi
            echo "$label verified: $actual"
          }

          assert_equal "Application ID" "$expected_application_id" "$actual_application_id"
          assert_equal "Version code" "$expected_version_code" "$actual_version_code"
          assert_equal "Version name" "$expected_version_name" "$actual_version_name"
          assert_equal "Minimum SDK" "$expected_min_sdk" "$actual_min_sdk"
          assert_equal "Target SDK" "$expected_target_sdk" "$actual_target_sdk"

          certificate_output="$("$apksigner_path" verify \
            --min-sdk-version "$actual_min_sdk" \
            --print-certs \
            "$apk_path")"
          mapfile -t certificate_digests < <(
            printf '%s\n' "$certificate_output" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          )
          unset certificate_output

          if [ "${#certificate_digests[@]}" -ne 1 ] || \
             [ "${certificate_digests[0]}" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::Release APK signing certificate does not match the pinned certificate"
            exit 1
          fi
          unset certificate_digests
          echo "Release APK signature and signing certificate verified"

      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_RELEASE_CERT_SHA256: '6667B73DA7322E56626D82CA0EFCF03386E0B5560E14DF48C6025142FF4197EA'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITEE_REPOSITORY: jukomu/jq-viewer
        run: |
          set -euo pipefail
          version="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          artifact_version="$(printf '%s' "$version" | tr '.' '_')"
          apk_path="JQ-Viewer-$artifact_version.apk"
          node scripts/release-assets.mjs "$RELEASE_TAG" "$apk_path" "$RUNNER_TEMP/latest.json"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          draft: false
          prerelease: ${{ steps.release_mode.outputs.is_prerelease == 'true' }}
          body_path: .github/release-notes.md
          generate_release_notes: false
          overwrite_files: true
          files: JQ-Viewer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK and latest.json to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: jukomu/jq-viewer
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PRERELEASE: ${{ steps.release_mode.outputs.is_prerelease }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          artifact_version="$(printf '%s' "$version" | tr '.' '_')"
          apk_path="JQ-Viewer-$artifact_version.apk"
          args=(
            "$RELEASE_TAG"
            "$apk_path"
            ".github/release-notes.md"
            "$RELEASE_COMMIT"
          )
          if [ "$RELEASE_PRERELEASE" != "true" ]; then
            args+=("$RUNNER_TEMP/latest.json")
          fi
          node scripts/publish-gitee-release.mjs "${args[@]}"

      - name: Attach latest.json to GitHub Release
        if: ${{ steps.release_mode.outputs.is_prerelease != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          draft: false
          prerelease: false
          body_path: .github/release-notes.md
          generate_release_notes: false
          overwrite_files: true
          files: ${{ runner.temp }}/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public release assets
        if: ${{ steps.release_mode.outputs.is_prerelease != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          artifact_version="$(printf '%s' "$version" | tr '.' '_')"
          apk_name="JQ-Viewer-$artifact_version.apk"
          github_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          gitee_base="https://gitee.com/jukomu/jq-viewer/releases/download/$RELEASE_TAG"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          github_apk="$temp_dir/github.apk"
          gitee_apk="$temp_dir/gitee.apk"
          github_manifest="$temp_dir/github-latest.json"
          gitee_manifest="$temp_dir/gitee-latest.json"

          curl --fail --silent --show-error --location --retry 3 \
            "$github_base/$apk_name" -o "$github_apk"
          curl --fail --silent --show-error --location --retry 3 \
            "$gitee_base/$apk_name" -o "$gitee_apk"
          curl --fail --silent --show-error --location --retry 3 \
            "$github_base/latest.json" -o "$github_manifest"
          curl --fail --silent --show-error --location --retry 3 \
            "$gitee_base/latest.json" -o "$gitee_manifest"

          github_sha="$(sha256sum "$github_apk" | awk '{print toupper($1)}')"
          gitee_sha="$(sha256sum "$gitee_apk" | awk '{print toupper($1)}')"
          if [ "$github_sha" != "$gitee_sha" ]; then
            echo "::error::GitHub/Gitee APK SHA-256 mismatch: $github_sha != $gitee_sha"
            exit 1
          fi
          if ! cmp --silent "$github_apk" "$gitee_apk"; then
            echo "::error::GitHub/Gitee APK bytes are different"
            exit 1
          fi

          if ! cmp --silent "$github_manifest" "$gitee_manifest"; then
            echo "::error::GitHub/Gitee latest.json bytes are different"
            exit 1
          fi

          manifest_tag="$(jq -r '.tag' "$github_manifest")"
          manifest_apk_name="$(jq -r '.apkName' "$github_manifest")"
          manifest_size="$(jq -r '.sizeBytes' "$github_manifest")"
          manifest_sha="$(jq -r '.sha256' "$github_manifest" | tr '[:lower:]' '[:upper:]')"
          manifest_github_url="$(jq -r '.sources.github' "$github_manifest")"
          manifest_gitee_url="$(jq -r '.sources.gitee' "$github_manifest")"
          actual_size="$(stat -c '%s' "$github_apk")"

          if [ "$manifest_tag" != "$RELEASE_TAG" ] || \
             [ "$manifest_apk_name" != "$apk_name" ] || \
             [ "$manifest_size" != "$actual_size" ] || \
             [ "$manifest_sha" != "$github_sha" ]; then
            echo "::error::latest.json does not match the public APK"
            exit 1
          fi
          if [ "$manifest_github_url" != "$github_base/$apk_name" ] || \
             [ "$manifest_gitee_url" != "$gitee_base/$apk_name" ]; then
            echo "::error::latest.json source URLs do not match release assets"
            exit 1
          fi

          echo "Public release assets verified: identical APK and latest.json"

      - name: Cleanup release secrets and artifacts
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f android/app/release.keystore
          rm -f android/keystore.properties
          rm -f android/app/build/outputs/apk/release/app-release.apk
          rm -f JQ-Viewer-*.apk
          rm -f "$RUNNER_TEMP/latest.json"
