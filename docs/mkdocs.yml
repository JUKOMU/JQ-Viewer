site_name: JQ Viewer 用户文档
repo_url: https://github.com/JUKOMU/JQ-Viewer
repo_name: JUKOMU/JQ-Viewer
# 编辑入口跟随维护中的 dev 分支。
edit_uri: edit/dev/docs/sources/

docs_dir: sources
site_dir: site

theme:
  name: material
  language: zh
  features:
    - content.action.edit

nav:
  - 项目介绍: index.md
  - 下载、安装与更新: installation.md
  - 应用首页与侧边栏: first-open.md
  - 首页搜索与分类: search-and-categories.md
  - 作品详情与阅读: reading.md
  - 收藏夹: favorites.md
  - 下载: downloads.md
  - 历史: history.md
  - 设置与下级页面: settings.md
  - 常见问题与反馈: troubleshooting.md

plugins:
  - search
